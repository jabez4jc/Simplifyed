<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simplifyed - Sign In</title>
  <link rel="stylesheet" href="/css/landing.css">
  <style>
    :root {
      --primary: var(--accent-signal);
      --primary-dark: #cc4629;
      --primary-light: #ff7c61;
      --success: var(--accent-success);
      --error: #ef4444;
      --warning: #f59e0b;
    }

    body {
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255, 87, 51, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255, 87, 51, 0.05) 0%, transparent 40%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
      line-height: 1.6;
      font-family: var(--font-main);
    }

    .auth-container {
      background: var(--bg-card);
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius-sharp);
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      position: relative;
    }

    .auth-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent-signal);
    }

    .auth-header {
      padding: 2.5rem 2rem 1.5rem;
      text-align: left;
    }

    .auth-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: -0.04em;
    }

    .auth-header h1 span {
      color: var(--accent-signal);
    }

    .auth-header p {
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .auth-body {
      padding: 0 2rem 2.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-size: 0.625rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius-sharp);
      font-size: 0.875rem;
      color: var(--text-primary);
      transition: all 0.2s;
      outline: none;
      font-family: var(--font-main);
    }

    .form-input:focus {
      border-color: var(--accent-signal);
      background: rgba(255, 255, 255, 0.06);
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .password-field-wrapper {
      position: relative;
    }

    .password-field-wrapper .form-input {
      padding-right: 2.75rem;
    }

    .password-toggle-btn {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      color: var(--text-muted);
    }

    .password-toggle-btn:hover {
      color: var(--text-secondary);
    }

    .password-toggle-btn svg {
      width: 18px;
      height: 18px;
    }

    .btn-block {
      width: 100%;
      justify-content: center;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(10, 10, 11, 0.3);
      border-top-color: var(--bg-dark);
      border-radius: 50%;
      animation: spin-login 0.6s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin-login {
      to {
        transform: rotate(360deg);
      }
    }

    .message {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sharp);
      font-size: 0.8125rem;
      margin-top: 1.5rem;
      font-family: var(--font-mono);
      border: 1px solid transparent;
    }

    .message.success {
      background: rgba(16, 185, 129, 0.05);
      color: var(--accent-success);
      border-color: rgba(16, 185, 129, 0.2);
    }

    .message.error {
      background: rgba(239, 68, 68, 0.05);
      color: var(--error);
      border-color: rgba(239, 68, 68, 0.2);
    }

    .message.info {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
      border-color: var(--accent-dim);
    }

    .help-text {
      font-size: 0.6875rem;
      color: var(--text-muted);
      margin-top: 1.5rem;
      line-height: 1.4;
      text-align: center;
    }

    @media (max-width: 480px) {
      .auth-container {
        border-width: 0 0 1px 0;
        border-radius: 0;
      }

      .auth-header,
      .auth-body {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <div class="auth-header">
      <div class="logo text-2xl">SIMPLIFYED<span>.VELOCITY</span></div>
      <p>Terminal Access Protocol</p>
    </div>

    <div class="auth-body">
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input id="login-email" class="form-input" type="email" placeholder="you@example.com" autocomplete="email"
            required>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-field-wrapper">
            <input id="login-password" class="form-input" type="password" placeholder="Enter your password"
              autocomplete="current-password" required>
            <button type="button" class="password-toggle-btn" aria-label="Show password"
              onclick="togglePasswordVisibility('login-password', this)">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10 12.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z" />
                <path fill-rule="evenodd" d="M.664 10.59a1.651 1.651 0 010-1.186A10.004 10.004 0 0110 3c4.257 0 7.893 2.66 9.336 6.41.147.381.146.804 0 1.186A10.004 10.004 0 0110 17c-4.257 0-7.893-2.66-9.336-6.41zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-v btn-v-primary btn-block" id="login-btn">
          <span>Sign In</span>
        </button>
      </form>

      <p class="help-text">
        Forgot your password? Contact your administrator.
      </p>

      <!-- Message Area -->
      <div id="message-area"></div>
    </div>
  </div>

  <script>
    // Track the in-flight login request so a second submit can cancel the first
    // (e.g. double-click) instead of racing it.
    const activeOperations = new Map();

    function showMessage(text, type = 'info') {
      const messageArea = document.getElementById('message-area');
      messageArea.innerHTML = `<div class="message ${type}">${text}</div>`;
      setTimeout(() => {
        messageArea.innerHTML = '';
      }, 8000);
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const showing = input.type === 'password';
      input.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
    }

    function setButtonLoading(buttonId, loading, originalText = '') {
      const button = document.getElementById(buttonId);

      if (loading) {
        // Store original text as data attribute for reliable restoration
        if (!button.dataset.originalText) {
          button.dataset.originalText = originalText || button.textContent.trim();
        }
        button.disabled = true;
        button.innerHTML = '<div class="spinner"></div><span>Processing...</span>';
      } else {
        button.disabled = false;
        const restoredText = button.dataset.originalText || originalText || 'Submit';
        button.innerHTML = `<span>${restoredText}</span>`;
        delete button.dataset.originalText;
      }
    }

    // Redirect the user based on access (dashboard vs pending)
    async function redirectBasedOnAccess() {
      const token = localStorage.getItem('auth_token');
      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      try {
        const response = await fetch('/api/user', {
          method: 'GET',
          credentials: 'include',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (response.ok) {
          window.location.href = '/dashboard.html';
          return;
        }

        if (response.status === 403) {
          window.location.href = '/access-pending.html';
          return;
        }

        // Invalid/expired token
        localStorage.removeItem('auth_token');
        window.location.href = '/login.html';
      } catch (error) {
        console.error('Access redirect error:', error);
        localStorage.removeItem('auth_token');
        window.location.href = '/login.html';
      }
    }

    // Handle Login
    async function handleLogin(event) {
      event.preventDefault();

      const operationKey = 'login';
      // Cancel any existing login operation
      if (activeOperations.has(operationKey)) {
        activeOperations.get(operationKey).abort();
      }

      const abortController = new AbortController();
      activeOperations.set(operationKey, abortController);

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showMessage('Please enter both email and password', 'error');
        activeOperations.delete(operationKey);
        return;
      }

      setButtonLoading('login-btn', true, 'Sign In');

      try {
        const response = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: abortController.signal,
          body: JSON.stringify({ email, password }),
        });

        const result = await response.json();

        if (abortController.signal.aborted) return;

        if (!response.ok || result.status !== 'success') {
          throw new Error(result.message || 'Invalid email or password');
        }

        localStorage.setItem('auth_token', result.data.token);
        showMessage('Login successful! Redirecting...', 'success');

        await redirectBasedOnAccess();

      } catch (error) {
        if (abortController.signal.aborted) return;
        console.error('Login error:', error);
        showMessage(error.message, 'error');
        setButtonLoading('login-btn', false, 'Sign In');
      } finally {
        activeOperations.delete(operationKey);
      }
    }

    // If already logged in, skip straight to the access check - otherwise just show the form.
    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('auth_token')) {
        redirectBasedOnAccess();
      }
    });
  </script>
</body>

</html>
